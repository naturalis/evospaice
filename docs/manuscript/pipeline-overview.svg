<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3b52"/>
    </marker>
    <style>
      .box { fill: #f7f9fc; stroke: #2f3b52; stroke-width: 2; rx: 12; ry: 12; }
      .txt { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #1f2937; }
      .small { font-size: 15px; fill: #4b5563; }
      .title { font-size: 24px; font-weight: bold; }
      .arrow { stroke: #2f3b52; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="550" y="36" text-anchor="middle" class="txt title">EvoSpaice high-level workflow for external barcode reference trees</text>

  <rect class="box" x="30" y="95" width="240" height="210"/>
  <text class="txt" x="150" y="130" text-anchor="middle">Input data</text>
  <text class="txt small" x="150" y="165" text-anchor="middle">BOLD records + taxonomy</text>
  <text class="txt small" x="150" y="190" text-anchor="middle">COI primer-window cropping</text>
  <text class="txt small" x="150" y="215" text-anchor="middle">Within-taxon dereplication</text>
  <text class="txt small" x="150" y="240" text-anchor="middle">Insect-focused run scope</text>

  <rect class="box" x="310" y="95" width="240" height="210"/>
  <text class="txt" x="430" y="130" text-anchor="middle">Track 1</text>
  <text class="txt small" x="430" y="165" text-anchor="middle">Embedding inference</text>
  <text class="txt small" x="430" y="190" text-anchor="middle">One vector per retained record</text>
  <text class="txt small" x="430" y="215" text-anchor="middle">Global index + metadata</text>
  <text class="txt small" x="430" y="240" text-anchor="middle">No global distance matrix</text>

  <rect class="box" x="590" y="95" width="240" height="210"/>
  <text class="txt" x="710" y="130" text-anchor="middle">Tracks 2–3</text>
  <text class="txt small" x="710" y="165" text-anchor="middle">Post-order tree traversal</text>
  <text class="txt small" x="710" y="190" text-anchor="middle">Local NJ in each taxonomic bush</text>
  <text class="txt small" x="710" y="215" text-anchor="middle">Bottom-up branch scaling</text>
  <text class="txt small" x="710" y="240" text-anchor="middle">Representative carried upward</text>

  <rect class="box" x="870" y="95" width="200" height="210"/>
  <text class="txt" x="970" y="130" text-anchor="middle">Outputs</text>
  <text class="txt small" x="970" y="165" text-anchor="middle">External reference tree</text>
  <text class="txt small" x="970" y="190" text-anchor="middle">for reusable alpha/beta PD</text>
  <text class="txt small" x="970" y="215" text-anchor="middle">across monitoring runs</text>
  <text class="txt small" x="970" y="240" text-anchor="middle">(+ curation side use)</text>

  <line class="arrow" x1="270" y1="200" x2="310" y2="200"/>
  <line class="arrow" x1="550" y1="200" x2="590" y2="200"/>
  <line class="arrow" x1="830" y1="200" x2="870" y2="200"/>

  <rect class="box" x="420" y="325" width="260" height="70"/>
  <text class="txt small" x="550" y="353" text-anchor="middle">Parallel validation workstream:</text>
  <text class="txt small" x="550" y="376" text-anchor="middle">embedding distances vs sequence distances</text>
</svg>

