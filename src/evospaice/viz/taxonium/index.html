    <style>

      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #fff;
        color: #1b1b1b;
        font-family: "Avenir Next", "Trebuchet MS", sans-serif;

      }

        display: flex;
        align-items: center;
        gap: 0.55rem;

      }

      .brand-logo {
        width: 2rem;
        height: 3.4rem;
        flex: 0 0 auto;

      }

      .brand-copy {
        display: grid;
        line-height: 0.9;
      }

      .brand-copy strong {
        font-size: 1rem;
        font-weight: 800;
      }

      .brand-copy span {
        margin-top: 0.2rem;
        font-size: 0.63rem;
        line-height: 0.9;
      }

      .header-divider {
        width: 1px;
        height: 3.4rem;
        background: #292929;
      }

      .product-copy {
        min-width: 0;
      }

      .product-copy h1 {
        margin: 0;
        font-size: 1.18rem;
        font-weight: 800;

      .reference-picker {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.5rem;
        margin-left: auto;
        padding: 0.45rem 0.65rem;
        border: 1px solid #a5a5a5;
        border-radius: 4px;
        background: #fff;

      .reference-picker:hover {

      .sample-bar {

  <body>
    <div id="root">
      <header class="site-header">

        </div>
        <label class="reference-picker">

    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import Taxonium from "./vendor/taxonium-component/taxonium-component.es.js";
      import {
        filterToTipLabels,
        findMrca,
        parseNewickTopology,
        propagateTipMemberships,
        serializeSubtree,
        serializeTreeWithMemberships,
      } from "./newick.mjs";

      const treeUrl = "/data/pruned.tre.txt";
      const taxonomyUrl = "/data/unified_taxonomic_tree_metadata.tsv";
      const fallbackTaxonomyUrl = "/data/pruned.taxonomy.tsv";
      const fileInput = document.getElementById("tree-file");
      const overlayInput = document.getElementById("overlay-file");
      const sampleDropzone = document.getElementById("sample-dropzone");
      const sampleList = document.getElementById("sample-list");
      const filename = document.getElementById("filename");
      const comparisonSummary = document.getElementById("comparison-summary");
      const overlapDetails = document.getElementById("overlap-details");
      const overlapCount = document.getElementById("overlap-count");
      const overlapList = document.getElementById("overlap-list");
      const showOverlapOnlyButton = document.getElementById("show-overlap-only");
      const showInternalNodesInput = document.getElementById("show-internal-nodes");
      const selectionInstruction = document.getElementById("selection-instruction");
      const nodeSelections = document.getElementById("node-selections");
      const focusSubtreeButton = document.getElementById("focus-subtree");
      const clearNodeSelectionsButton = document.getElementById("clear-node-selections");
      const showFullTreeButton = document.getElementById("show-full-tree");
      const viewer = document.getElementById("viewer");
      const root = createRoot(viewer);
      const overlayField = "meta_sample";
      const comparisonField = "meta_in_comparison";
      const comparisonValue = "Included";
      const sampleColors = [
        [74, 183, 134],
        [193, 49, 218],
        [43, 125, 210],
        [232, 151, 42],
        [225, 76, 101],
        [73, 169, 183],
      ];
      let currentTree = null;
      let currentOverlays = [];
      let displayedTopology = null;
      let focusedSubtree = null;
      let overlappingTipLabels = [];
      let selectedNodes = [];
      let suppressComparisonAutoZoom = false;
      let taxonomyByNode = new Map();
      let taxonomyFields = ["species"];
      let showInternalNodes = false;
      let sampleCounter = 0;
      let treeVersion = 0;

      function TaxoniumView({ sourceData, configDict, initialQuery }) {
        const [query, setQuery] = React.useState(initialQuery);

        function updateQuery(update) {
          setQuery((current) => ({ ...current, ...update }));
        }

        return React.createElement(Taxonium, {
          sourceData,
          configDict,
          query,
          updateQuery,
          onNodeSelect: handleNodeSelect,
          onNodeDetailsLoaded: handleNodeDetailsLoaded,
        });
      }

      function showError(error) {
        console.error(error);
        root.render(
          React.createElement(
            "div",
            { className: "status", "data-state": "error" },
            error.message,
          ),
        );
      }

      function validateTree(newick, selectedFilename) {
        if (!newick.trimEnd().endsWith(";")) {
          throw new Error(`${selectedFilename} is not a complete Newick tree`);
        }
      }

      function annotateNodeBranchLength(descriptor) {
        let inQuote = false;
        let commentDepth = 0;
        let colonPosition = -1;
        const comments = [];
        let commentStart = -1;

        for (let position = 0; position < descriptor.length; position += 1) {
          const character = descriptor[position];
          if (inQuote) {
            if (character === "'" && descriptor[position + 1] === "'") {
              position += 1;
            } else if (character === "'") {
              inQuote = false;
            }
          } else if (character === "'") {
            inQuote = true;
          } else if (character === "[") {
            if (commentDepth === 0) {
              commentStart = position;
            }
            commentDepth += 1;
          } else if (character === "]" && commentDepth > 0) {
            commentDepth -= 1;
            if (commentDepth === 0) {
              comments.push([commentStart, position]);
            }
          } else if (character === ":" && commentDepth === 0) {
            colonPosition = position;
          }
        }

        if (colonPosition < 0) {
          return descriptor;
        }
        const lengthMatch = descriptor.slice(colonPosition + 1).match(
          /^\s*([+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)/,
        );
        if (!lengthMatch) {
          return descriptor;
        }
        const branchLength = lengthMatch[1];
        const existingComment = comments.at(-1);
        if (!existingComment) {
          return `${descriptor}[&branch_length=${branchLength}]`;
        }

        const [start, end] = existingComment;
        const commentBody = descriptor.slice(start + 1, end);
        if (/(?:^|[,&])\s*branch_length\s*=/.test(commentBody)) {
          return descriptor;
        }
        const separator = commentBody.trim() ? "," : "&";
        return `${descriptor.slice(0, end)}${separator}branch_length=${branchLength}` +
          `${descriptor.slice(end)}`;
      }

      function annotateBranchLengths(newick) {
        let output = "";
        let descriptor = "";
        let inQuote = false;
        let commentDepth = 0;

        for (let position = 0; position < newick.length; position += 1) {
          const character = newick[position];
          if (inQuote) {
            descriptor += character;
            if (character === "'" && newick[position + 1] === "'") {
              descriptor += newick[position + 1];
              position += 1;
            } else if (character === "'") {
              inQuote = false;
            }
          } else if (character === "'") {
            inQuote = true;
            descriptor += character;
          } else if (character === "[") {
            commentDepth += 1;
            descriptor += character;
          } else if (character === "]" && commentDepth > 0) {
            commentDepth -= 1;
            descriptor += character;
          } else if (commentDepth === 0 && "(),;".includes(character)) {
            output += annotateNodeBranchLength(descriptor) + character;
            descriptor = "";
          } else {
            descriptor += character;
          }
        }

        return output + annotateNodeBranchLength(descriptor);
      }

      function extractTipLabels(newick) {
        const labels = [];
        let position = 0;
        let expectingNode = true;

        function skipComment() {
          let depth = 0;
          do {
            const character = newick[position];
            position += 1;
            if (character === "[") {
              depth += 1;
            } else if (character === "]") {
              depth -= 1;
            }
          } while (position < newick.length && depth > 0);
        }

        function readQuotedLabel() {
          let label = "";
          position += 1;
          while (position < newick.length) {
            const character = newick[position];
            position += 1;
            if (character !== "'") {
              label += character;
            } else if (newick[position] === "'") {
              label += "'";
              position += 1;
            } else {
              return label;
            }
          }
          throw new Error("The tree contains an unterminated quoted label");
        }

        while (position < newick.length) {
          const character = newick[position];
          if (/\s/.test(character)) {
            position += 1;
          } else if (character === "[") {
            skipComment();
          } else if (character === "(" || character === ",") {
            expectingNode = true;
            position += 1;
          } else if (character === ")") {
            expectingNode = false;
            position += 1;
          } else if (character === ";") {
            break;
          } else if (character === "'") {
            const label = readQuotedLabel();
            if (expectingNode) {
              labels.push(label);
              expectingNode = false;
            }
          } else if (expectingNode) {
            const start = position;
            while (position < newick.length && !":,();[".includes(newick[position])) {
              position += 1;
            }
            const label = newick.slice(start, position).trim();
            if (label) {
              labels.push(label);
              expectingNode = false;
            }
          } else {
            position += 1;
          }
        }

        return labels;
      }

      function setComparisonSummary(message, state = "ready") {
        comparisonSummary.textContent = message;
        comparisonSummary.title = message;
        comparisonSummary.dataset.state = state;
      }

      function renderOverlapDetails(overlappingTips) {
        overlappingTipLabels = overlappingTips.map(([node]) => node);
        overlapDetails.open = false;
        overlapDetails.hidden = overlappingTips.length === 0;
        showOverlapOnlyButton.hidden = overlappingTips.length === 0 ||
          focusedSubtree?.kind === "overlap";
        overlapCount.textContent = `${overlappingTips.length} overlapping ` +
          `tip${overlappingTips.length === 1 ? "" : "s"}`;
        const items = overlappingTips
          .sort(([left], [right]) => left.localeCompare(right))
          .map(([node, samples]) => {
            const item = document.createElement("div");
            item.className = "overlap-item";
            const nodeLabel = document.createElement("strong");
            nodeLabel.textContent = node;
            const sampleLabels = document.createElement("span");
            sampleLabels.textContent = samples.join(" + ");
            item.append(nodeLabel, sampleLabels);
            return item;
          });
        overlapList.replaceChildren(...items);
      }

      function renderNodeSelections() {
        const selections = selectedNodes.map((selection, index) => {
          const item = document.createElement("span");
          item.className = "node-selection";
          item.title = selection.label;
          item.textContent = `${index + 1}. ${selection.label}`;
          return item;
        });
        nodeSelections.replaceChildren(...selections);

        if (focusedSubtree) {
          selectionInstruction.textContent = focusedSubtree.description ||
            `Showing a ${focusedSubtree.tipCount.toLocaleString()}-tip subtree`;
          focusSubtreeButton.hidden = true;
          clearNodeSelectionsButton.hidden = true;
          showFullTreeButton.hidden = false;
          return;
        }

        selectionInstruction.textContent = selectedNodes.length === 2
          ? "Ready to focus"
          : selectedNodes.length === 1
            ? "Select one more node"
            : "Select two nodes in the tree";
        focusSubtreeButton.hidden = false;
        focusSubtreeButton.disabled = selectedNodes.length !== 2;
        clearNodeSelectionsButton.hidden = selectedNodes.length === 0;
        showFullTreeButton.hidden = true;
      }

      function handleNodeSelect(nodeId) {
        if (nodeId === null) {
          return;
        }
        const normalizedId = Number(nodeId);
        if (selectedNodes.some((selection) => selection.id === normalizedId)) {
          return;
        }
        if (selectedNodes.length === 2) {
          selectedNodes = [];
        }
        selectedNodes.push({ id: normalizedId, label: `Node ${normalizedId}` });
        renderNodeSelections();
      }

      function handleNodeDetailsLoaded(nodeId, details) {
        if (nodeId === null || !details) {
          return;
        }
        const selection = selectedNodes.find((item) => item.id === Number(nodeId));
        if (!selection) {
          return;
        }
        selection.label = details.name || `Internal node ${nodeId}`;
        renderNodeSelections();
      }

      function clearNodeSelections() {
        selectedNodes = [];
        renderNodeSelections();
      }

      function focusSelectedSubtree() {
        if (selectedNodes.length !== 2 || !displayedTopology) {
          return;
        }
        const first = displayedTopology.byId.get(selectedNodes[0].id);
        const second = displayedTopology.byId.get(selectedNodes[1].id);
        if (!first || !second) {
          setComparisonSummary("Could not resolve the selected nodes", "error");
          return;
        }
        const subtreeRoot = findMrca(first, second);
        focusedSubtree = {
          newick: serializeSubtree(subtreeRoot),
          tipCount: subtreeRoot.numTips,
        };
        selectedNodes = [];
        renderNodeSelections();
        renderTree();
      }

      function showFullTree() {
        focusedSubtree = null;
        selectedNodes = [];
        suppressComparisonAutoZoom = true;
        renderNodeSelections();
        renderTree();
      }

      function showOverlapOnly() {
        if (!displayedTopology || !overlappingTipLabels.length) {
          return;
        }
        const filteredRoot = filterToTipLabels(
          displayedTopology.root,
          new Set(overlappingTipLabels),
        );
        focusedSubtree = {
          newick: serializeSubtree(filteredRoot),
          tipCount: filteredRoot.numTips,
          description: `Showing ${filteredRoot.numTips.toLocaleString()} overlapping ` +
            `tip${filteredRoot.numTips === 1 ? "" : "s"}`,
          kind: "overlap",
        };
        selectedNodes = [];
        renderNodeSelections();
        renderTree();
      }

      function parseTaxonomyMetadata(tsv, sourceUrl) {
        const lines = tsv.trimEnd().split(/\r?\n/);
        const columns = (lines.shift() || "").split("\t");
        if (!["id", "node"].includes(columns[0]) || columns.length < 2) {
          throw new Error(`${sourceUrl} does not have an id or node column`);
        }
        const fields = columns.slice(1);
        if (new Set(fields).size !== fields.length) {
          throw new Error(`${sourceUrl} has duplicate metadata columns`);
        }
        const records = new Map(lines.filter(Boolean).map((line) => {
          const values = line.split("\t");
          return [values[0], Object.fromEntries(
            fields.map((field, index) => [field, values[index + 1] || ""]),
          )];
        }));
        return { fields, records };
      }

      function loadMetadataText(sourceUrl) {
        return new Promise((resolve, reject) => {
          const request = new XMLHttpRequest();
          request.open("GET", sourceUrl);
          request.timeout = 30000;
          request.onload = () => {
            if (request.status >= 200 && request.status < 300) {
              resolve(request.responseText);
            } else {
              reject(new Error(
                `Could not load ${sourceUrl}: HTTP ${request.status}`,
              ));
            }
          };
          request.onerror = () => reject(new Error(`Could not load ${sourceUrl}`));
          request.ontimeout = () => reject(new Error(`${sourceUrl} timed out`));
          request.send();
        });
      }

      function sampleNameFromFilename(selectedFilename) {
        let baseName = selectedFilename.replace(/\.(nwk|newick|tree|tre|txt)$/i, "");
        const names = new Set(currentOverlays.map((sample) => sample.name));
        let candidate = baseName || "sample";
        let suffix = 2;
        while (names.has(candidate)) {
          candidate = `${baseName}_${suffix}`;
          suffix += 1;
        }
        return candidate.replace(/[\t\r\n]/g, " ");
      }

      function removeSample(sampleId) {
        currentOverlays = currentOverlays.filter((sample) => sample.id !== sampleId);
        if (currentTree) {
          renderTree();
        } else {
          renderSampleChips();
          setComparisonSummary(currentOverlays.length ? "Waiting for the reference tree" : "No samples added");
        }
      }

      function setSampleIncluded(sampleId, included) {
        const sample = currentOverlays.find((candidate) => candidate.id === sampleId);
        if (!sample) {
          return;
        }
        sample.included = included;
        if (focusedSubtree?.kind === "overlap") {
          focusedSubtree = null;
          selectedNodes = [];
          renderNodeSelections();
        }
        if (currentTree) {
          renderTree();
        } else {
          renderSampleChips();
        }
      }

      function renderSampleChips() {
        const chips = currentOverlays.map((sample) => {
          const included = sample.included !== false;
          const chip = document.createElement("div");
          chip.className = "sample-chip";
          chip.dataset.included = String(included);
          const matchStatus = sample.matchCount === undefined
            ? "Waiting for the reference tree"
            : `${sample.matchCount}/${sample.tipLabels.length} tips matched`;
          chip.title = `${sample.filename}: ${matchStatus}`;

          const swatch = document.createElement("span");
          swatch.className = "sample-swatch";
          swatch.style.backgroundColor = `rgb(${sample.color.join(",")})`;

          const name = document.createElement("span");
          name.className = "sample-name";
          name.textContent = sample.name;

          const toggle = document.createElement("label");
          toggle.className = "sample-toggle";
          toggle.title = `${included ? "Exclude" : "Include"} ${sample.name}`;
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = included;
          checkbox.setAttribute("aria-label", `Include ${sample.name} in comparison`);
          checkbox.addEventListener("change", () => {
            setSampleIncluded(sample.id, checkbox.checked);
          });
          toggle.append(checkbox, swatch, name);

          const menu = document.createElement("details");
          menu.className = "sample-menu";
          const menuToggle = document.createElement("summary");
          menuToggle.title = `Options for ${sample.name}`;
          menuToggle.setAttribute("aria-label", `Options for ${sample.name}`);
          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.textContent = "Remove sample";
          removeButton.addEventListener("click", () => removeSample(sample.id));
          menu.append(menuToggle, removeButton);

          chip.append(toggle, menu);
          return chip;
        });
        sampleList.replaceChildren(...chips);
      }

      function renderTree() {
        const displayNewick = focusedSubtree ? focusedSubtree.newick : currentTree.newick;
        displayedTopology = parseNewickTopology(displayNewick);
        const sourceData = {
          status: "loaded",
          filename: focusedSubtree
            ? `${currentTree.filename} (${focusedSubtree.tipCount}-tip subtree)`
            : currentTree.filename,
          filetype: "nwk",
          data: annotateBranchLengths(displayNewick),
        };
        let configDict = {
          defaultColorByField: "None",
          hideInternalNodes: !showInternalNodes,
        };
        let initialQuery = {};
        const mainTips = new Set(extractTipLabels(displayNewick));
        const referenceTips = focusedSubtree
          ? new Set(extractTipLabels(currentTree.newick))
          : mainTips;
        const assignments = new Map();
        let membershipsByNode = new Map();
        const includedOverlays = currentOverlays
          .filter((sample) => sample.included !== false);
        const includedSampleSummary = includedOverlays.length === currentOverlays.length
          ? `${includedOverlays.length} sample${includedOverlays.length === 1 ? "" : "s"}`
          : `${includedOverlays.length} of ${currentOverlays.length} samples included`;

        if (includedOverlays.length) {
          const matchedTips = new Set();
          const referenceMatchedTips = new Set();
          let unmatched = 0;

          includedOverlays.forEach((sample) => {
            const referenceMatches = sample.tipLabels
              .filter((label) => referenceTips.has(label));
            const matches = referenceMatches.filter((label) => mainTips.has(label));
            sample.matchCount = referenceMatches.length;
            unmatched += sample.tipLabels.length - referenceMatches.length;
            referenceMatches.forEach((label) => referenceMatchedTips.add(label));
            matches.forEach((label) => {
              matchedTips.add(label);
              const memberships = assignments.get(label) || [];
              memberships.push(sample.name);
              assignments.set(label, memberships);
            });
          });
          renderSampleChips();
          const overlappingTips = [...assignments]
            .filter(([, samples]) => samples.length > 1);
          membershipsByNode = propagateTipMemberships(
            displayedTopology.root,
            assignments,
          );
          renderOverlapDetails(overlappingTips);

          if (matchedTips.size > 0) {
            const comparisonSearchValue = comparisonValue + "\u200B".repeat(treeVersion + 1);
            const colorMapping = Object.fromEntries(
              includedOverlays.map((sample) => [sample.name, sample.color]),
            );
            new Set([...membershipsByNode.values()]
              .filter((memberships) => memberships.length > 1)
              .map((memberships) => memberships.length))
              .forEach((count) => {
                colorMapping[`Overlap (${count})`] = [31, 31, 31];
              });
            configDict = {
              defaultColorByField: overlayField,
              colorMapping,
              colorBranchesByMetadata: true,
              hideInternalNodes: !showInternalNodes,
            };
            const overlaySearch = {
              key: `overlay-match-${treeVersion + 1}`,
              type: comparisonField,
              method: "text_exact",
              text: comparisonSearchValue,
              controls: true,
              min_tips: 0,
            };
            initialQuery = {
              srch: JSON.stringify([overlaySearch]),
              enabled: JSON.stringify({ [overlaySearch.key]: false }),
              color: JSON.stringify({ field: overlayField }),
            };
            if (!focusedSubtree && !suppressComparisonAutoZoom) {
              initialQuery.zoomToSearch = 0;
            }
            if (focusedSubtree?.kind === "overlap") {
              setComparisonSummary(
                `${includedSampleSummary}, ` +
                  `showing ${matchedTips.size} overlapping tip${matchedTips.size === 1 ? "" : "s"}`,
              );
            } else if (focusedSubtree) {
              setComparisonSummary(
                `${includedSampleSummary}, ` +
                  `${matchedTips.size} sample tip${matchedTips.size === 1 ? "" : "s"} visible`,
              );
            } else {
              setComparisonSummary(
                `${includedSampleSummary}, ` +
                  `${referenceMatchedTips.size} unique tips matched` +
                  (overlappingTips.length ? `, ${overlappingTips.length} overlapping` : "") +
                  (unmatched ? `, ${unmatched} unmatched` : ""),
              );
            }
          } else {
            setComparisonSummary(
              "No sample tip labels match the reference tree",
              "error",
            );
          }
        } else {
          renderSampleChips();
          renderOverlapDetails([]);
          setComparisonSummary(currentOverlays.length
            ? `0 of ${currentOverlays.length} samples included`
            : "No samples added");
        }

        if (membershipsByNode.size) {
          sourceData.data = annotateBranchLengths(
            serializeTreeWithMemberships(displayedTopology.root, membershipsByNode),
          );
        }

        const comparisonSearchValue = includedOverlays.length
          ? comparisonValue + "\u200B".repeat(treeVersion + 1)
          : "";
        const comparisonMetadataFields = includedOverlays.length
          ? ["sample", "sample_memberships", "overlap_count", "in_comparison"]
          : [];
        const metadataRows = [
          ["node", ...taxonomyFields, ...comparisonMetadataFields].join("\t"),
        ];
        mainTips.forEach((node) => {
          const taxonomy = taxonomyByNode.get(node) || {};
          const taxonomyValues = taxonomyFields.map((field) => taxonomy[field] || "");
          const memberships = assignments.get(node) || [];
          const sample = memberships.length > 1
            ? `Overlap (${memberships.length})`
            : memberships[0] || "";
          if (taxonomyValues.some(Boolean) || sample) {
            const comparisonValues = includedOverlays.length
              ? [
                sample,
                memberships.join(", "),
                memberships.length,
                sample ? comparisonSearchValue : "",
              ]
              : [];
            metadataRows.push(
              [node, ...taxonomyValues, ...comparisonValues].join("\t"),
            );
          }
        });
        if (metadataRows.length > 1) {
          sourceData.metadata = {
            status: "loaded",
            filename: "pruned-taxonomy-and-comparisons.tsv",
            filetype: "meta_tsv",
            data: metadataRows.join("\n"),
          };
        }

        treeVersion += 1;
        root.render(
          React.createElement(TaxoniumView, {
            key: treeVersion,
            sourceData,
            configDict,
            initialQuery,
          }),
        );
        suppressComparisonAutoZoom = false;
      }

      function showTree(newick, selectedFilename) {
        validateTree(newick, selectedFilename);
        currentTree = { newick, filename: selectedFilename };
        focusedSubtree = null;
        selectedNodes = [];
        renderNodeSelections();
        filename.textContent = selectedFilename;
        filename.title = selectedFilename;
        renderTree();
      }

      async function addSampleFiles(files) {
        const failures = [];
        let added = 0;
        for (const file of files) {
          try {
            const newick = await file.text();
            validateTree(newick, file.name);
            const tipLabels = [...new Set(extractTipLabels(newick))];
            if (!tipLabels.length) {
              throw new Error(`${file.name} has no tip labels`);
            }
            const color = sampleColors[sampleCounter % sampleColors.length];
            sampleCounter += 1;
            currentOverlays.push({
              id: sampleCounter,
              filename: file.name,
              name: sampleNameFromFilename(file.name),
              newick,
              tipLabels,
              color,
              included: true,
            });
            added += 1;
          } catch (error) {
            console.error(error);
            failures.push(error.message);
          }
        }

        if (added && currentTree) {
          renderTree();
        } else {
          renderSampleChips();
          if (added) {
            setComparisonSummary("Waiting for the reference tree");
          }
        }
        if (failures.length) {
          setComparisonSummary(failures[0], "error");
        }
      }

      async function loadTaxonomyMetadata() {
        const fallbackTaxonomy = parseTaxonomyMetadata(
          await loadMetadataText(fallbackTaxonomyUrl),
          fallbackTaxonomyUrl,
        );
        taxonomyByNode = fallbackTaxonomy.records;
        taxonomyFields = fallbackTaxonomy.fields;
        const taxonomyText = await loadMetadataText(taxonomyUrl).catch((error) => {
          console.warn(
            `${taxonomyUrl} could not be loaded; using species-only fallback metadata`,
            error,
          );
          return null;
        });
        if (taxonomyText !== null) {
          const richerTaxonomy = parseTaxonomyMetadata(
            taxonomyText,
            taxonomyUrl,
          );
          taxonomyFields = [
            ...richerTaxonomy.fields,
            ...fallbackTaxonomy.fields.filter(
              (field) => !richerTaxonomy.fields.includes(field),
            ),
          ];
          richerTaxonomy.records.forEach((taxonomy, id) => {
            taxonomyByNode.set(id, {
              ...(taxonomyByNode.get(id) || {}),
              ...taxonomy,
            });
          });
        } else {
          console.warn(
            `${taxonomyUrl} is unavailable; using species-only fallback metadata`,
          );
        }
      }

      async function loadDefaultTree() {
        const treeResponse = await fetch(treeUrl);
        if (!treeResponse.ok) {
          throw new Error(`Could not load ${treeUrl}: HTTP ${treeResponse.status}`);
        }

        showTree(await treeResponse.text(), "pruned.tre.txt");
        const defaultTree = currentTree;
        loadTaxonomyMetadata()
          .then(() => {
            if (currentTree === defaultTree) {
              renderTree();
            }
          })
          .catch((error) => {
            console.warn("Taxonomy metadata could not be loaded", error);
          });
      }

      fileInput.addEventListener("change", async () => {
        const [file] = fileInput.files;
        if (!file) {
          return;
        }

        try {
          showTree(await file.text(), file.name);
        } catch (error) {
          showError(error);
        } finally {
          fileInput.value = "";
        }
      });

      overlayInput.addEventListener("change", async () => {
        if (!overlayInput.files.length) {
          return;
        }
        await addSampleFiles(overlayInput.files);
        overlayInput.value = "";
      });

      ["dragenter", "dragover"].forEach((eventName) => {
        sampleDropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          sampleDropzone.dataset.dragging = "true";
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        sampleDropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          sampleDropzone.dataset.dragging = "false";
        });
      });

      sampleDropzone.addEventListener("drop", async (event) => {
        if (event.dataTransfer.files.length) {
          await addSampleFiles(event.dataTransfer.files);
        }
      });

      focusSubtreeButton.addEventListener("click", focusSelectedSubtree);
      clearNodeSelectionsButton.addEventListener("click", clearNodeSelections);
      showFullTreeButton.addEventListener("click", showFullTree);
      showOverlapOnlyButton.addEventListener("click", showOverlapOnly);
      showInternalNodesInput.addEventListener("change", () => {
        showInternalNodes = showInternalNodesInput.checked;
        if (currentTree) {
          renderTree();
        }
      });

      renderNodeSelections();
      loadDefaultTree().catch(showError);
    </script>
  </body>
</html>
