<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evospaice Taxonium viewer</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #fff;
        color: #1b1b1b;
        font-family: "Avenir Next", "Trebuchet MS", sans-serif;
      }

      #root {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
      }

      .site-header {
        z-index: 1;
        display: flex;
        min-height: 5.25rem;
        align-items: center;
        gap: 1.4rem;
        padding: 0.65rem 1.5rem;
        border-top: 7px solid #050505;
        border-bottom: 2px solid #171717;
        background: #fff;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        flex: 0 0 auto;
      }

      .brand-logo {
        width: 2rem;
        height: 3.4rem;
        flex: 0 0 auto;
        object-fit: contain;
      }

      .brand-copy {
        display: grid;
        line-height: 0.9;
      }

      .brand-copy strong {
        font-size: 1rem;
        font-weight: 800;
      }

      .brand-copy span {
        margin-top: 0.2rem;
        font-size: 0.63rem;
        line-height: 0.9;
      }

      .header-divider {
        width: 1px;
        height: 3.4rem;
        background: #292929;
      }

      .product-copy {
        min-width: 0;
      }

      .product-copy h1 {
        margin: 0;
        font-size: 1.18rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      .product-copy p {
        margin: 0.2rem 0 0;
        color: #555;
        font-size: 0.9rem;
      }

      .reference-picker {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.5rem;
        margin-left: auto;
        padding: 0.45rem 0.65rem;
        border: 1px solid #a5a5a5;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 0.76rem;
        font-weight: 700;
      }

      .reference-picker:hover {
        background: #f2f2f2;
      }

      .sample-bar {
        z-index: 2;
        display: flex;
        min-height: 6.5rem;
        align-items: center;
        flex-wrap: wrap;
        gap: 1.25rem;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #9d9d9d;
        background: #f0f0f0;
      }

      .sample-dropzone {
        display: flex;
        width: min(25rem, 100%);
        min-height: 4.8rem;
        box-sizing: border-box;
        align-items: center;
        gap: 0.9rem;
        padding: 0.7rem 0.85rem;
        border: 2px dashed #333;
        background: #fff;
        cursor: pointer;
      }

      .sample-dropzone:hover,
      .sample-dropzone[data-dragging="true"] {
        border-color: #147a57;
        background: #f4fbf8;
      }

      .sample-dropzone:focus-within,
      .reference-picker:focus-within {
        outline: 3px solid #147a57;
        outline-offset: 2px;
      }

      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .upload-icon {
        display: grid;
        width: 3rem;
        height: 3rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #a9a9a9;
        color: #fff;
        font-size: 1.75rem;
        place-items: center;
      }

      .upload-copy {
        display: grid;
        min-width: 0;
        gap: 0.2rem;
      }

      .upload-copy strong {
        font-size: 1rem;
      }

      .upload-copy span {
        color: #666;
        font-size: 0.87rem;
      }

      .upload-copy u {
        color: #1b1b1b;
        font-weight: 700;
        text-underline-offset: 0.15rem;
      }

      .sample-list {
        display: flex;
        min-width: 0;
        align-items: center;
        flex: 1 1 20rem;
        flex-wrap: wrap;
        gap: 0.85rem;
      }

      .sample-chip {
        position: relative;
        display: flex;
        max-width: 18rem;
        min-height: 2.8rem;
        box-sizing: border-box;
        align-items: center;
        gap: 0.65rem;
        padding: 0.35rem 0.55rem 0.35rem 0.75rem;
        border: 2px solid #1d1d1d;
        border-radius: 999px;
        background: #fff;
        font-size: 0.92rem;
        font-weight: 700;
      }

      .sample-swatch {
        width: 0.85rem;
        height: 0.85rem;
        flex: 0 0 auto;
        border-radius: 50%;
      }

      .sample-name,
      .filename {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .filename {
        max-width: 12rem;
        color: #555;
        font-size: 0.72rem;
        font-weight: 500;
      }

      .sample-menu {
        position: relative;
      }

      .sample-menu summary {
        display: grid;
        width: 1.7rem;
        height: 1.7rem;
        cursor: pointer;
        list-style: none;
        place-items: center;
      }

      .sample-menu summary::-webkit-details-marker {
        display: none;
      }

      .sample-menu summary::before {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #333;
        box-shadow: 0 -5px 0 #333, 0 5px 0 #333;
        content: "";
      }

      .sample-menu button {
        position: absolute;
        z-index: 10;
        top: 2rem;
        right: 0;
        width: max-content;
        padding: 0.5rem 0.7rem;
        border: 1px solid #777;
        border-radius: 3px;
        background: #fff;
        box-shadow: 0 3px 10px rgb(0 0 0 / 18%);
        cursor: pointer;
        font: 0.78rem "Avenir Next", "Trebuchet MS", sans-serif;
      }

      .comparison-summary {
        flex: 1 0 100%;
        min-height: 1rem;
        color: #555;
        font-size: 0.75rem;
      }

      .comparison-summary[data-state="error"] {
        color: #a32929;
      }

      @media (max-width: 720px) {
        .site-header {
          min-height: 4.6rem;
          gap: 0.8rem;
          padding: 0.55rem 0.8rem;
        }

        .brand-copy,
        .header-divider,
        .product-copy p {
          display: none;
        }

        .product-copy h1 {
          font-size: 1rem;
        }

        .reference-picker {
          max-width: 7rem;
        }

        .reference-picker .filename {
          display: none;
        }

        .sample-bar {
          max-height: 13rem;
          align-items: stretch;
          gap: 0.75rem;
          overflow-y: auto;
          padding: 0.75rem;
        }

        .sample-dropzone {
          width: 100%;
          min-height: 4rem;
        }

        .upload-icon {
          width: 2.6rem;
          height: 2.6rem;
        }

        .sample-list {
          flex-basis: 100%;
        }
      }

      #viewer {
        min-width: 0;
        min-height: 0;
      }

      .status {
        box-sizing: border-box;
        display: grid;
        width: 100%;
        height: 100%;
        padding: 2rem;
        place-items: center;
        color: #24332b;
        text-align: center;
      }

      .status[data-state="error"] {
        color: #8a2828;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.1.1",
          "react/jsx-runtime": "https://esm.sh/react@19.1.1/jsx-runtime",
          "react/jsx-dev-runtime": "https://esm.sh/react@19.1.1/jsx-dev-runtime",
          "react-dom": "https://esm.sh/react-dom@19.1.1",
          "react-dom/client": "https://esm.sh/react-dom@19.1.1/client"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <header class="site-header">
        <div class="brand-lockup" aria-label="Naturalis Biodiversity Center">
          <img class="brand-logo" src="naturalis-logo.svg" alt="">
          <span class="brand-copy">
            <strong>Naturalis</strong>
            <span>Biodiversity<br>Center</span>
          </span>
        </div>
        <span class="header-divider" aria-hidden="true"></span>
        <div class="product-copy">
          <h1>_evospaice</h1>
          <p>Map and compare samples against reference tree</p>
        </div>
        <label class="reference-picker">
          Reference tree
          <span id="filename" class="filename">pruned.tre.txt</span>
          <input id="tree-file" class="file-input" type="file" accept=".nwk,.newick,.tree,.tre,.txt">
        </label>
      </header>
      <section class="sample-bar" aria-label="Comparison samples">
        <label id="sample-dropzone" class="sample-dropzone">
          <span class="upload-icon" aria-hidden="true">&#8593;</span>
          <span class="upload-copy">
            <strong>Add a sample to compare</strong>
            <span>Drag and drop or <u>upload</u> a file here</span>
          </span>
          <input id="overlay-file" class="file-input" type="file" multiple accept=".nwk,.newick,.tree,.tre,.txt">
        </label>
        <div id="sample-list" class="sample-list"></div>
        <div id="comparison-summary" class="comparison-summary" aria-live="polite">No samples added</div>
      </section>
      <div id="viewer">
        <div class="status">Loading the pruned phylogenetic tree...</div>
      </div>
    </div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import Taxonium from "https://esm.sh/taxonium-component@2.1.24?external=react,react-dom";

      const treeUrl = "/data/pruned.tre.txt";
      const taxonomyUrl = "/data/pruned.taxonomy.tsv";
      const fileInput = document.getElementById("tree-file");
      const overlayInput = document.getElementById("overlay-file");
      const sampleDropzone = document.getElementById("sample-dropzone");
      const sampleList = document.getElementById("sample-list");
      const filename = document.getElementById("filename");
      const comparisonSummary = document.getElementById("comparison-summary");
      const viewer = document.getElementById("viewer");
      const root = createRoot(viewer);
      const overlayField = "meta_sample";
      const comparisonField = "meta_in_comparison";
      const comparisonValue = "Included";
      const sampleColors = [
        [74, 183, 134],
        [193, 49, 218],
        [43, 125, 210],
        [232, 151, 42],
        [225, 76, 101],
        [73, 169, 183],
      ];
      let currentTree = null;
      let currentOverlays = [];
      let taxonomyByNode = new Map();
      let sampleCounter = 0;
      let treeVersion = 0;

      function TaxoniumView({ sourceData, configDict, initialQuery }) {
        const [query, setQuery] = React.useState(initialQuery);

        function updateQuery(update) {
          setQuery((current) => ({ ...current, ...update }));
        }

        return React.createElement(Taxonium, {
          sourceData,
          configDict,
          query,
          updateQuery,
        });
      }

      function showError(error) {
        console.error(error);
        root.render(
          React.createElement(
            "div",
            { className: "status", "data-state": "error" },
            error.message,
          ),
        );
      }

      function validateTree(newick, selectedFilename) {
        if (!newick.trimEnd().endsWith(";")) {
          throw new Error(`${selectedFilename} is not a complete Newick tree`);
        }
      }

      function annotateNodeBranchLength(descriptor) {
        let inQuote = false;
        let commentDepth = 0;
        let colonPosition = -1;
        const comments = [];
        let commentStart = -1;

        for (let position = 0; position < descriptor.length; position += 1) {
          const character = descriptor[position];
          if (inQuote) {
            if (character === "'" && descriptor[position + 1] === "'") {
              position += 1;
            } else if (character === "'") {
              inQuote = false;
            }
          } else if (character === "'") {
            inQuote = true;
          } else if (character === "[") {
            if (commentDepth === 0) {
              commentStart = position;
            }
            commentDepth += 1;
          } else if (character === "]" && commentDepth > 0) {
            commentDepth -= 1;
            if (commentDepth === 0) {
              comments.push([commentStart, position]);
            }
          } else if (character === ":" && commentDepth === 0) {
            colonPosition = position;
          }
        }

        if (colonPosition < 0) {
          return descriptor;
        }
        const lengthMatch = descriptor.slice(colonPosition + 1).match(
          /^\s*([+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)/,
        );
        if (!lengthMatch) {
          return descriptor;
        }
        const branchLength = lengthMatch[1];
        const existingComment = comments.at(-1);
        if (!existingComment) {
          return `${descriptor}[&branch_length=${branchLength}]`;
        }

        const [start, end] = existingComment;
        const commentBody = descriptor.slice(start + 1, end);
        if (/(?:^|[,&])\s*branch_length\s*=/.test(commentBody)) {
          return descriptor;
        }
        const separator = commentBody.trim() ? "," : "&";
        return `${descriptor.slice(0, end)}${separator}branch_length=${branchLength}` +
          `${descriptor.slice(end)}`;
      }

      function annotateBranchLengths(newick) {
        let output = "";
        let descriptor = "";
        let inQuote = false;
        let commentDepth = 0;

        for (let position = 0; position < newick.length; position += 1) {
          const character = newick[position];
          if (inQuote) {
            descriptor += character;
            if (character === "'" && newick[position + 1] === "'") {
              descriptor += newick[position + 1];
              position += 1;
            } else if (character === "'") {
              inQuote = false;
            }
          } else if (character === "'") {
            inQuote = true;
            descriptor += character;
          } else if (character === "[") {
            commentDepth += 1;
            descriptor += character;
          } else if (character === "]" && commentDepth > 0) {
            commentDepth -= 1;
            descriptor += character;
          } else if (commentDepth === 0 && "(),;".includes(character)) {
            output += annotateNodeBranchLength(descriptor) + character;
            descriptor = "";
          } else {
            descriptor += character;
          }
        }

        return output + annotateNodeBranchLength(descriptor);
      }

      function extractTipLabels(newick) {
        const labels = [];
        let position = 0;
        let expectingNode = true;

        function skipComment() {
          let depth = 0;
          do {
            const character = newick[position];
            position += 1;
            if (character === "[") {
              depth += 1;
            } else if (character === "]") {
              depth -= 1;
            }
          } while (position < newick.length && depth > 0);
        }

        function readQuotedLabel() {
          let label = "";
          position += 1;
          while (position < newick.length) {
            const character = newick[position];
            position += 1;
            if (character !== "'") {
              label += character;
            } else if (newick[position] === "'") {
              label += "'";
              position += 1;
            } else {
              return label;
            }
          }
          throw new Error("The tree contains an unterminated quoted label");
        }

        while (position < newick.length) {
          const character = newick[position];
          if (/\s/.test(character)) {
            position += 1;
          } else if (character === "[") {
            skipComment();
          } else if (character === "(" || character === ",") {
            expectingNode = true;
            position += 1;
          } else if (character === ")") {
            expectingNode = false;
            position += 1;
          } else if (character === ";") {
            break;
          } else if (character === "'") {
            const label = readQuotedLabel();
            if (expectingNode) {
              labels.push(label);
              expectingNode = false;
            }
          } else if (expectingNode) {
            const start = position;
            while (position < newick.length && !":,();[".includes(newick[position])) {
              position += 1;
            }
            const label = newick.slice(start, position).trim();
            if (label) {
              labels.push(label);
              expectingNode = false;
            }
          } else {
            position += 1;
          }
        }

        return labels;
      }

      function setComparisonSummary(message, state = "ready") {
        comparisonSummary.textContent = message;
        comparisonSummary.title = message;
        comparisonSummary.dataset.state = state;
      }

      function parseTaxonomyMetadata(tsv) {
        const lines = tsv.trimEnd().split(/\r?\n/);
        if (lines.shift() !== "node\tspecies") {
          throw new Error(`${taxonomyUrl} does not have the expected node and species columns`);
        }
        return new Map(lines.map((line) => {
          const separator = line.indexOf("\t");
          return [line.slice(0, separator), line.slice(separator + 1)];
        }));
      }

      function sampleNameFromFilename(selectedFilename) {
        let baseName = selectedFilename.replace(/\.(nwk|newick|tree|tre|txt)$/i, "");
        const names = new Set(currentOverlays.map((sample) => sample.name));
        let candidate = baseName || "sample";
        let suffix = 2;
        while (names.has(candidate)) {
          candidate = `${baseName}_${suffix}`;
          suffix += 1;
        }
        return candidate.replace(/[\t\r\n]/g, " ");
      }

      function removeSample(sampleId) {
        currentOverlays = currentOverlays.filter((sample) => sample.id !== sampleId);
        if (currentTree) {
          renderTree();
        } else {
          renderSampleChips();
          setComparisonSummary(currentOverlays.length ? "Waiting for the reference tree" : "No samples added");
        }
      }

      function renderSampleChips() {
        const chips = currentOverlays.map((sample) => {
          const chip = document.createElement("div");
          chip.className = "sample-chip";
          const matchStatus = sample.matchCount === undefined
            ? "Waiting for the reference tree"
            : `${sample.matchCount}/${sample.tipLabels.length} tips matched`;
          chip.title = `${sample.filename}: ${matchStatus}`;

          const swatch = document.createElement("span");
          swatch.className = "sample-swatch";
          swatch.style.backgroundColor = `rgb(${sample.color.join(",")})`;

          const name = document.createElement("span");
          name.className = "sample-name";
          name.textContent = sample.name;

          const menu = document.createElement("details");
          menu.className = "sample-menu";
          const menuToggle = document.createElement("summary");
          menuToggle.title = `Options for ${sample.name}`;
          menuToggle.setAttribute("aria-label", `Options for ${sample.name}`);
          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.textContent = "Remove sample";
          removeButton.addEventListener("click", () => removeSample(sample.id));
          menu.append(menuToggle, removeButton);

          chip.append(swatch, name, menu);
          return chip;
        });
        sampleList.replaceChildren(...chips);
      }

      function renderTree() {
        const sourceData = {
          status: "loaded",
          filename: currentTree.filename,
          filetype: "nwk",
          data: annotateBranchLengths(currentTree.newick),
        };
        let configDict = { defaultColorByField: "None" };
        let initialQuery = {};
        const mainTips = new Set(extractTipLabels(currentTree.newick));
        const assignments = new Map();

        if (currentOverlays.length) {
          const matchedTips = new Set();
          let unmatched = 0;

          currentOverlays.forEach((sample) => {
            const matches = sample.tipLabels.filter((label) => mainTips.has(label));
            sample.matchCount = matches.length;
            unmatched += sample.tipLabels.length - matches.length;
            matches.forEach((label) => {
              matchedTips.add(label);
              if (!assignments.has(label)) {
                assignments.set(label, sample.name);
              }
            });
          });
          renderSampleChips();

          if (matchedTips.size > 0) {
            const comparisonSearchValue = comparisonValue + "\u200B".repeat(treeVersion + 1);
            configDict = {
              defaultColorByField: overlayField,
              colorMapping: Object.fromEntries(
                currentOverlays.map((sample) => [sample.name, sample.color]),
              ),
            };
            const overlaySearch = {
              key: `overlay-match-${treeVersion + 1}`,
              type: comparisonField,
              method: "text_exact",
              text: comparisonSearchValue,
              controls: true,
              min_tips: 0,
            };
            initialQuery = {
              srch: JSON.stringify([overlaySearch]),
              enabled: JSON.stringify({ [overlaySearch.key]: false }),
              color: JSON.stringify({ field: overlayField }),
              zoomToSearch: 0,
            };
            setComparisonSummary(
              `${currentOverlays.length} sample${currentOverlays.length === 1 ? "" : "s"}, ` +
                `${matchedTips.size} unique tips matched` +
                (unmatched ? `, ${unmatched} unmatched` : ""),
            );
          } else {
            setComparisonSummary(
              "No sample tip labels match the reference tree",
              "error",
            );
          }
        } else {
          renderSampleChips();
          setComparisonSummary("No samples added");
        }

        const comparisonSearchValue = currentOverlays.length
          ? comparisonValue + "\u200B".repeat(treeVersion + 1)
          : "";
        const metadataRows = [
          currentOverlays.length ? "node\tspecies\tsample\tin_comparison" : "node\tspecies",
        ];
        mainTips.forEach((node) => {
          const species = taxonomyByNode.get(node) || "";
          const sample = assignments.get(node) || "";
          if (species || sample) {
            metadataRows.push(currentOverlays.length
              ? `${node}\t${species}\t${sample}\t${sample ? comparisonSearchValue : ""}`
              : `${node}\t${species}`);
          }
        });
        if (metadataRows.length > 1) {
          sourceData.metadata = {
            status: "loaded",
            filename: "pruned-taxonomy-and-comparisons.tsv",
            filetype: "meta_tsv",
            data: metadataRows.join("\n"),
          };
        }

        treeVersion += 1;
        root.render(
          React.createElement(TaxoniumView, {
            key: treeVersion,
            sourceData,
            configDict,
            initialQuery,
          }),
        );
      }

      function showTree(newick, selectedFilename) {
        validateTree(newick, selectedFilename);
        currentTree = { newick, filename: selectedFilename };
        filename.textContent = selectedFilename;
        filename.title = selectedFilename;
        renderTree();
      }

      async function addSampleFiles(files) {
        const failures = [];
        let added = 0;
        for (const file of files) {
          try {
            const newick = await file.text();
            validateTree(newick, file.name);
            const tipLabels = [...new Set(extractTipLabels(newick))];
            if (!tipLabels.length) {
              throw new Error(`${file.name} has no tip labels`);
            }
            const color = sampleColors[sampleCounter % sampleColors.length];
            sampleCounter += 1;
            currentOverlays.push({
              id: sampleCounter,
              filename: file.name,
              name: sampleNameFromFilename(file.name),
              newick,
              tipLabels,
              color,
            });
            added += 1;
          } catch (error) {
            console.error(error);
            failures.push(error.message);
          }
        }

        if (added && currentTree) {
          renderTree();
        } else {
          renderSampleChips();
          if (added) {
            setComparisonSummary("Waiting for the reference tree");
          }
        }
        if (failures.length) {
          setComparisonSummary(failures[0], "error");
        }
      }

      async function loadDefaultTree() {
        const [treeResponse, taxonomyResponse] = await Promise.all([
          fetch(treeUrl),
          fetch(taxonomyUrl),
        ]);
        if (!treeResponse.ok) {
          throw new Error(`Could not load ${treeUrl}: HTTP ${treeResponse.status}`);
        }
        if (!taxonomyResponse.ok) {
          throw new Error(`Could not load ${taxonomyUrl}: HTTP ${taxonomyResponse.status}`);
        }

        taxonomyByNode = parseTaxonomyMetadata(await taxonomyResponse.text());
        showTree(await treeResponse.text(), "pruned.tre.txt");
      }

      fileInput.addEventListener("change", async () => {
        const [file] = fileInput.files;
        if (!file) {
          return;
        }

        try {
          showTree(await file.text(), file.name);
        } catch (error) {
          showError(error);
        } finally {
          fileInput.value = "";
        }
      });

      overlayInput.addEventListener("change", async () => {
        if (!overlayInput.files.length) {
          return;
        }
        await addSampleFiles(overlayInput.files);
        overlayInput.value = "";
      });

      ["dragenter", "dragover"].forEach((eventName) => {
        sampleDropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          sampleDropzone.dataset.dragging = "true";
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        sampleDropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          sampleDropzone.dataset.dragging = "false";
        });
      });

      sampleDropzone.addEventListener("drop", async (event) => {
        if (event.dataTransfer.files.length) {
          await addSampleFiles(event.dataTransfer.files);
        }
      });

      loadDefaultTree().catch(showError);
    </script>
  </body>
</html>
